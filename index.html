<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Instagram</title>

<!-- Makes iOS treat this as a standalone web app. No <link rel="manifest"> on
     purpose: a manifest's start_url is exactly what was overriding your URL. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Instagram">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<!-- Optional: drop a 180x180 PNG next to this file and uncomment for a custom icon. -->
<link rel="apple-touch-icon" href="instagram-logo.png">


<!-- Fallback if JavaScript is off. -->
<noscript><meta http-equiv="refresh" content="0; url=https://www.instagram.com/?variant=following"></noscript>

<style>
  :root { color-scheme: dark; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #000;
    color: #8e8e8e;
    font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    -webkit-user-select: none;
    user-select: none;
  }
  a {
    color: #e6e6e6;
    text-decoration: none;
    border-bottom: 1px solid #333;
    padding-bottom: 2px;
  }
</style>
</head>
<body>

<p id="status">Opening…</p>

<script>
  var TARGET = "https://www.instagram.com/?variant=following";

  // replace() keeps this page out of the back stack.
  location.replace(TARGET);

  // If the jump hasn't happened after a moment, offer a manual tap.
  setTimeout(function () {
    document.getElementById("status").innerHTML =
      '<a href="' + TARGET + '">Open the following feed</a>';
  }, 1500);
</script>

</body>
</html>
